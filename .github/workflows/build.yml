name: Build 3DSX
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: make
      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: platformer3ds
          path: platformer3ds.3dsx
